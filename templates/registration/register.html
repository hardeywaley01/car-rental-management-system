<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Car Rental</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 35px;
        }

        .register-card h1 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }

        .helptext {
            display: block;
            margin-top: 6px;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }

        ul.errorlist {
            color: #f87171;
            padding-left: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
        }

        .login-link a,
        .back-home a {
            color: #38bdf8;
            text-decoration: none;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your customer account to request a car rental.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

        <div class="back-home">
            <a href="{% url 'home' %}">← Back to Home</a>
        </div>

    </div>

</body>
</html>
