<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Car Rental System
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 0 30px;
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .footer {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            color: #6b7280;
        }
        .cards {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

    .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow:
            0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
        margin-top: 0;
    }

    .number {
        font-size: 40px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    </style>
    <style>

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
    );
    gap: 20px;
    margin: 30px 0;
}

.dashboard-card {
    display: block;
    padding: 25px;
    border-radius: 15px;
    text-decoration: none;
    background: #ffffff;
    border: 1px solid #ddd;
    box-shadow: 0 4px 15px rgba(
        0,
        0,
        0,
        0.08
    );
}

.dashboard-card h2 {
    margin-top: 0;
}

.dashboard-number {
    font-size: 42px;
    font-weight: bold;
}

.dashboard-summary {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(200px, 1fr)
    );
    gap: 20px;
    margin-bottom: 40px;
}

.summary-card {
    padding: 20px;
    border-radius: 12px;
    background: #f5f5f5;
}

.summary-card strong {
    font-size: 30px;
}

.section-title {
    margin-top: 30px;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

</style>

</head>

<body>
    {% if user.is_authenticated %}

    <span>
        Welcome, {{ user.username }}
    </span>

    <form
        method="POST"
        action="{% url 'logout' %}"
        style="display:inline;"
    >

        {% csrf_token %}

        <button type="submit" class="btn">
            Logout
        </button>

    </form>

{% endif %}

    <nav class="navbar">

        <div class="brand">
            Car Rental System
        </div>

        <div class="nav-links">

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'car_list' %}">
                Cars
            </a>

            <a href="{% url 'rental_list' %}">
                Rentals
            </a>

            <a href="{% url 'customer_list' %}">
                Customers
            </a>

            <a href="/admin/">
                Admin
            </a>
            <a href="{% url 'reports' %}">
                Reports
            </a>

        </div>

    </nav>


    <main class="container">

        {% block content %}
          {% if messages %}

                {% for message in messages %}

                    <div class="message">
                    {{ message }}
                    </div>

                {% endfor %}

            {% endif %}
        {% endblock %}

    </main>


    <footer class="footer">

        Car Rental System

    </footer>

</body>

</html>
