<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Car Rental</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .request-card {
            width: 100%;
            max-width: 520px;
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 32px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .car-name {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .car-info {
            background: #0f172a;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .car-info p {
            margin: 8px 0;
            color: #cbd5e1;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 7px;
            background: #0f172a;
            color: white;
        }

        .errorlist {
            color: #f87171;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="request-card">

        <h1>Request Car Rental</h1>

        <div class="car-name">
            {{ car.brand }} {{ car.model }}
        </div>

        <div class="car-info">
            <p>Year: {{ car.year }}</p>

            <p>
                Transmission:
                {{ car.get_transmission_display }}
            </p>

            <p>
                Seats: {{ car.seats }}
            </p>

            <p>
                Price per day:
                <strong>₦{{ car.daily_price }}</strong>
            </p>
        </div>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Submit Rental Request
            </button>

        </form>

        <a
            href="{% url 'customer_dashboard' %}"
            class="back"
        >
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
