{% extends "base.html" %}


{% block title %}

{% if car %}
    Edit Car
{% else %}
    Add Car
{% endif %}

{% endblock %}


{% block content %}

<h1 class="page-title">

{% if car %}
    Edit Car
{% else %}
    Add Car
{% endif %}

</h1>


<div class="card">

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}


        <button
            type="submit"
            class="btn"
        >

            {% if car %}
                Update Car
            {% else %}
                Save Car
            {% endif %}

        </button>

    </form>

</div>

{% endblock %}
